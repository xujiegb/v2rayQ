<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>v2rayQ · Client panel</title>
  <link rel="stylesheet" href="assets/panel.css">

<body data-panel="client">
  <div class="shell client-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brandmark">◈</span><div><strong>v2rayQ</strong><small>CLIENT PANEL</small></div></div>

      <header class="topbar"><div class="breadcrumbs"><span>Client</span><b>/</b><span id="breadcrumb">Overview</span></div><div class="top-actions"><span class="environment">LOCAL PREVIEW</span><span class="avatar">Q</span></div></header>

  </div>
