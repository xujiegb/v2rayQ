name: Rust platform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Shared models and local services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p v2rayQ --lib
      - run: cargo test -p v2rayq-storage
      - run: cargo check -p v2rayQ --features legacy-tui
      - run: cargo test -p v2rayq-contracts
      - run: cargo test -p v2rayq-http-preview
      - run: cargo build --locked -p v2rayq-server -p v2rayq-web-client -p v2rayq-cli
      - run: python3 tools/test_panel_api.py
      - run: python3 tools/check_ui_parity.py
      - run: python3 tools/check_workspace_boundaries.py
      - name: Check first-party safe Rust policy
        shell: bash
        run: |
          if grep -R -E '\bunsafe\b|\btransmute\b' --include='*.rs' apps crates src/client; then
            echo "Forbidden Rust construct in new code"
            exit 1
          fi
  desktop:
    name: Native and Web / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --locked -p v2rayq-client -p v2rayq-web-client -p v2rayq-server -p v2rayq-cli
  android-native-ui:
    name: Android arm64 egui Rust library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Configure Android NDK Clang
        shell: bash
        run: |
          ndk="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$llvm/aarch64-linux-android24-clang"
          echo "CC_aarch64_linux_android=$llvm/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$llvm/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$llvm/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$llvm/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo check --locked -p v2rayq-client --no-default-features --lib --target aarch64-linux-android
  ios-native-ui:
    name: iOS arm64 native egui simulator bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: sh packaging/mobile/ios/build.sh aarch64-apple-ios-sim
      - run: tar -czf dist/v2rayq-ios-simulator.tar.gz -C dist/aarch64-apple-ios-sim v2rayQ.app
      - uses: actions/upload-artifact@v4
        with:
          name: v2rayq-ios-simulator
          path: dist/v2rayq-ios-simulator.tar.gz
          if-no-files-found: error
  freebsd:
    name: FreeBSD 15 native and local services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          prepare: |
            pkg install -y rust pkgconf libxkbcommon wayland libX11 libxcb libXcursor libXi libXrandr
          run: |
            cargo check --locked -p v2rayq-web-client -p v2rayq-server -p v2rayq-cli
            cargo check -p v2rayq-client
