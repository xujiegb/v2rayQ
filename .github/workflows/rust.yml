name: Rust platform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Shared models and local services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p v2rayQ --lib
      - run: cargo test -p v2rayq-contracts
      - run: cargo test -p v2rayq-http-preview
      - run: cargo check -p v2rayq-server -p v2rayq-web-client
      - run: python3 tools/check_ui_parity.py
      - name: Check first-party safe Rust policy
        shell: bash
        run: |
          if grep -R -E '\bunsafe\b|\btransmute\b' --include='*.rs' apps crates src/client; then
            echo "Forbidden Rust construct in new code"
            exit 1
          fi
  desktop:
    name: Native and Web / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check -p v2rayq-client -p v2rayq-web-client -p v2rayq-server
  android-native-ui:
    name: Android arm64 egui Rust library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo check -p v2rayq-client --no-default-features --lib --target aarch64-linux-android
  ios-native-ui:
    name: iOS arm64 egui Rust library
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo check -p v2rayq-client --no-default-features --lib --target aarch64-apple-ios
  freebsd:
    name: FreeBSD 15 native and local services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          prepare: |
            pkg install -y rust pkgconf libxkbcommon wayland libX11 libxcb libXcursor libXi libXrandr
          run: |
            cargo check -p v2rayq-web-client -p v2rayq-server
            cargo check -p v2rayq-client
