[package]
name = "v2rayq-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "v2rayq_client"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = []

[[bin]]
name = "v2rayq-client"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
v2rayq-qr = { path = "../../crates/qr" }
uuid = "1"
v2rayq-i18n = { path = "../../crates/i18n" }
v2rayQ = { path = "../.." }
v2rayq-contracts = { path = "../../crates/contracts" }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
