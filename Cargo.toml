[package]
name = "v2rayQ"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
turso = "0.7.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
